# ── Server ─────────────────────────────────────────────────────────────────────
server.port=8080

# ── Gemini API ──────────────────────────────────────────────────────────────────
# Set your actual Gemini API key here OR export GEMINI_API_KEY in your shell
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.base-url=https://generativelanguage.googleapis.com
gemini.api.model=gemini-1.5-flash

# ── Disable JPA / DB (not needed) ──────────────────────────────────────────────
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.isha=DEBUG
